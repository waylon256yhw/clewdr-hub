[package]
name = "clewdr-hub"
version = "1.3.3"
edition = "2024"
authors = ["Xerxes-2 <dspxue@gmail.com>", "LeenHawk <leenhawk@leenhawk.com>"]
license = "AGPL-3.0"
repository = "https://github.com/waylon256yhw/clewdr-hub"

[[bin]]
name = "clewdr"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.release-ci]
inherits = "release"
lto = "thin"
codegen-units = 16

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
wreq = { version = "6.0.0-rc.28", features = [
    "cookies",
    "json",
    "multipart",
    "socks",
    "stream",
] }
wreq-util = "3.0.0-rc.10"
serde_json = "1"
const_format = { version = "0.2", features = ["fmt"] }
serde = { version = "1", features = ["derive"] }
colored = "3"
axum = { version = "0.8", features = ["macros"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "=0.3.19", features = [
    "chrono",
    "env-filter",
] }
chrono = "0.4"
futures = "0.3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
async-trait = "0.1"
toml = "1"
eventsource-stream = "0.2"
tracing-appender = "0.2"
self-replace = { version = "1", optional = true }
zip = { version = "8", optional = true, default-features = false, features = [
    "deflate",
] }
tempfile = "3"
tiktoken-rs = "0.9"
tower-http = { version = "0.6", features = [
    "compression-zstd",
    "cors",
    "trace",
] }
include_dir = { version = "0.7", optional = true }
figment = { version = "0.10", features = ["env", "toml"] }
arc-swap = "1"
url = { version = "2", features = ["serde"] }
strum = { version = "0.27", features = ["derive"] }
moka = { version = "0.12", features = ["sync"] }
tower = "0.5"
async-stream = "0.3"
console-subscriber = { version = "0.5", optional = true }
http = "1"
snafu = { version = "0.8", features = ["futures", "rust_1_81"] }
serde_with = { version = "3", features = ["chrono_0_4"] }
oauth2 = { version = "5", default-features = false }
ractor = "0.15"
sha2 = "0.10"
mimalloc = { version = "0.1", optional = true }
dhat = { version = "0", optional = true }
etcetera = { version = "0", optional = true }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
argon2 = { version = "0.5.3", features = ["std"] }
blake3 = "1.8.3"
rand = { version = "0.10.0", features = ["std_rng"] }
hmac = "0.12"
rpassword = "7"
semver = "1"
ipnet = { version = "2", features = ["serde"] }
aes-gcm = { version = "0.10", optional = true }
inquire = { version = "0.7", default-features = false, features = ["crossterm"], optional = true }
xxhash-rust = { version = "0.8.15", features = ["xxh64"] }

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
aws-lc-rs = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }


[features]
default = ["portable", "external-resource", "tui", "encrypt"]
tokio-console = ["dep:console-subscriber", "tokio/tracing"]
portable = ["dep:zip", "dep:self-replace"]
xdg = ["dep:etcetera"]
embed-resource = ["dep:include_dir"]
external-resource = ["tower-http/fs"]
mimalloc = ["dep:mimalloc"]
dhat-heap = ["dep:dhat"]
# Encrypted export/import bundle (Argon2id KDF + AES-256-GCM).
encrypt = ["dep:aes-gcm"]
# Interactive TUI menu (commit #11 — inquire-based, default-on).
tui = ["dep:inquire"]
