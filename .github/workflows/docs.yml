name: Deploy Docs to GitHub Pages

# 文档站源码在 website/（Astro Starlight）。
# PR 与推到 master 都会构建校验（坏链接 / frontmatter 错误 / 构建失败提前暴露）；
# 仅 master（push 或手动触发）才发布到 GitHub Pages。
# 首次使用需在仓库 Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"。
on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 按 ref 分组：PR 构建不会阻塞 master 发布。
# PR 新提交取消同 PR 的旧构建；master 发布不取消进行中的（避免发布半成品）。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build site
        run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    # 仅 master 发布；PR 只跑上面的 build 做校验。
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
